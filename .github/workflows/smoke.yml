name: Verificación del despliegue (TMDB real)
# Corre cuando Vercel informa un despliegue exitoso, o a mano. No usa ni muestra el token:
# consulta la app publicada, que agrega la credencial del lado servidor.
on:
  status:
  workflow_dispatch:
    inputs:
      url:
        description: URL de la app (opcional)
        required: false
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.context == 'Vercel' && github.event.state == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Verificar app, versión y TMDB
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
          EXPECTED_SHA: ${{ github.event.sha || github.sha }}
        run: |
          set -u
          candidates="${INPUT_URL:-} https://cine-match-pied-tau.vercel.app https://cine-match.vercel.app https://cine-match-gabrielsosaz-prog.vercel.app https://cine-match-gabrielsosaz-progs-projects.vercel.app https://cine-match-git-main-gabrielsosaz-prog.vercel.app"
          APP=""
          for u in $candidates; do
            [ -z "$u" ] && continue
            if curl -fsS --max-time 20 "$u/version.json" -o /tmp/v.json 2>/dev/null && grep -q "Cine Match AI" /tmp/v.json; then APP="$u"; break; fi
          done
          if [ -z "$APP" ]; then echo "::error::No se encontró la app publicada en las URLs candidatas"; exit 1; fi
          echo "App: $APP"; echo "Versión publicada: $(cat /tmp/v.json)"
          echo "--- /api/health"
          curl -sS --max-time 30 "$APP/api/health" | tee /tmp/h.json; echo
          grep -q '"ok":true' /tmp/h.json || { echo "::error::TMDB no respondió correctamente a través del servidor"; exit 1; }
          echo "--- Búsqueda real: Matrix"
          curl -fsS --max-time 30 "$APP/api/tmdb/search/multi?query=Matrix&language=es-MX" -o /tmp/s.json
          python3 -c "import json;r=json.load(open('/tmp/s.json'))['results'];print(len(r),'resultados');[print('-',x.get('media_type'),x.get('title') or x.get('name'),(x.get('release_date') or x.get('first_air_date') or '')[:4]) for x in r[:5]];assert any(x.get('id')==603 for x in r)"
          echo "--- Ficha + disponibilidad en Argentina (The Matrix, id 603)"
          curl -fsS --max-time 30 "$APP/api/tmdb/movie/603?language=es-MX&append_to_response=keywords,credits,watch/providers" -o /tmp/d.json
          python3 -c "import json;d=json.load(open('/tmp/d.json'));ar=d['watch/providers']['results'].get('AR',{});print('Título:',d['title'],'| géneros:',[g['name'] for g in d['genres']],'| keywords:',len(d['keywords']['keywords']));print('AR suscripción:',[p['provider_name'] for p in ar.get('flatrate',[])] or 'sin datos')"
          echo "--- v3: guionistas en la ficha (Volver al futuro, id 105)"
          curl -fsS --max-time 30 "$APP/api/tmdb/movie/105?language=es-MX&append_to_response=keywords,credits" -o /tmp/b.json
          python3 -c "import json;d=json.load(open('/tmp/b.json'));w=[c['name'] for c in d['credits']['crew'] if c.get('department')=='Writing'];print('Guion:',w);print('Reparto:',[c['name'] for c in d['credits']['cast'][:3]]);assert w"
          echo "--- v3: búsqueda de personas con id único (homónimos) y filmografía"
          curl -fsS --max-time 30 "$APP/api/tmdb/search/person?query=Michael%20J.%20Fox&language=es-MX" -o /tmp/p.json
          python3 -c "import json;r=json.load(open('/tmp/p.json'))['results'];print([(x['id'],x['name'],x.get('known_for_department')) for x in r[:3]]);assert any(x['id']==521 for x in r)"
          curl -fsS --max-time 30 "$APP/api/tmdb/person/521/combined_credits?language=es-MX" -o /tmp/c.json
          python3 -c "import json;d=json.load(open('/tmp/c.json'));c=sorted(d['cast'],key=lambda x:-x.get('vote_count',0));print(len(c),'créditos; más votados:',[(x.get('title') or x.get('name')) for x in c[:6]]);assert len(c)>10"
          echo "--- v3: descubrimiento por palabra clave (viaje en el tiempo, 4379) y género Terror en AR"
          curl -fsS --max-time 30 "$APP/api/tmdb/discover/movie?with_keywords=4379&sort_by=vote_count.desc&language=es-MX" -o /tmp/k.json
          python3 -c "import json;r=json.load(open('/tmp/k.json'))['results'];print([x['title'] for x in r[:5]]);assert r"
          curl -fsS --max-time 30 "$APP/api/tmdb/discover/movie?with_genres=27&watch_region=AR&with_watch_providers=8&with_watch_monetization_types=flatrate&sort_by=popularity.desc&language=es-MX" -o /tmp/t.json
          python3 -c "import json;r=json.load(open('/tmp/t.json'))['results'];print('Terror en Netflix AR:',[x['title'] for x in r[:5]]);assert r"
          echo "--- v3.1: Paramount+ (id 531) en la lista oficial de plataformas de Argentina"
          curl -fsS --max-time 30 "$APP/api/tmdb/watch/providers/movie?watch_region=AR&language=es-MX" -o /tmp/wp.json
          python3 -c "import json;r=json.load(open('/tmp/wp.json'))['results'];m=[(x['provider_id'],x['provider_name']) for x in r if 'paramount' in x['provider_name'].lower()];print(m);assert any(i==531 for i,_ in m)"
          echo "--- v3.1: videos oficiales (tráiler) de Volver al futuro"
          curl -fsS --max-time 30 "$APP/api/tmdb/movie/105/videos?language=es-MX&include_video_language=es,en,null" -o /tmp/vd.json
          python3 -c "import json;r=json.load(open('/tmp/vd.json'))['results'];print([(x['site'],x['type'],x['iso_639_1'],x.get('official'),x['name'][:40]) for x in r[:6]]);assert r"
          echo "--- v3.1: descubrir por país de origen (Argentina) y ficha de persona (Ricardo Darín, buscado por nombre)"
          curl -fsS --max-time 30 "$APP/api/tmdb/discover/movie?with_origin_country=AR&sort_by=vote_count.desc&language=es-MX" -o /tmp/oc.json
          python3 -c "import json;r=json.load(open('/tmp/oc.json'))['results'];print([x['title'] for x in r[:5]]);assert r"
          curl -fsS --max-time 30 "$APP/api/tmdb/search/person?query=Ricardo%20Darin&language=es-MX" -o /tmp/ps.json
          PID=$(python3 -c "import json;print(json.load(open('/tmp/ps.json'))['results'][0]['id'])")
          curl -fsS --max-time 30 "$APP/api/tmdb/person/$PID?language=es-MX" -o /tmp/pe.json
          python3 -c "import json;d=json.load(open('/tmp/pe.json'));print(d['name'],d.get('known_for_department'),d.get('place_of_birth'))"
          echo "--- v3.1: catálogo narrativo publicado"
          curl -fsS --max-time 30 "$APP/catalog/manifest.json" | tee /tmp/man.json; echo
          echo "--- El token no aparece en las respuestas públicas"
          if grep -l "eyJhbGci" /tmp/*.json; then echo "::error::Se encontró un token en una respuesta"; exit 1; fi
          echo "OK"
